name: Verify and deploy production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "setup/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akma-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: akma_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: akma_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject unsafe automatic migrations
        run: pnpm check:migrations

      - name: Validate deployment script
        run: |
          bash -n ops/akma-deploy
          bash -n ops/akma-deploy-ssh
          bash -n ops/akma-server

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run isolated unit tests
        run: pnpm test:unit

      - name: Run genuine PostgreSQL database integration tests
        env:
          TEST_DATABASE_URL: postgresql://akma_test:test_password@127.0.0.1:5432/akma_test_db
          AKMA_INTEGRATION_TEST: "1"
          AKMA_TEST_TRANSPORT: mock
          ADMIN_SESSION_SECRET: deterministic-ci-session-secret-not-for-production
        run: pnpm test:integration

      - name: Build production application
        run: pnpm build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://akmaofficial.ir
    steps:
      - name: Configure production SSH access
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/akma_deploy
          chmod 600 ~/.ssh/akma_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy verified commit
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          ssh -i ~/.ssh/akma_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$COMMIT_SHA"
